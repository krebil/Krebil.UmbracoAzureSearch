name: Release to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 17.3.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
    - name: Set version
      env:
        RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
      run: echo "VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"
    - name: Build
      run: dotnet build src/UmbracoAzureSearch/UmbracoAzureSearch.csproj -c Release -p:Version=$VERSION
    # Integration tests require live Azure AI Search and Elasticsearch instances.
    # Run them locally before releasing.
    - name: Pack NuGet
      run: dotnet pack src/UmbracoAzureSearch/UmbracoAzureSearch.csproj -c Release --no-build --output . -p:Version=$VERSION
    - name: Push to NuGet
      run: dotnet nuget push "*.nupkg" --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
